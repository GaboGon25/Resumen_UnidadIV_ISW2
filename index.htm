<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en" prefix="dc: http://purl.org/dc/elements/1.1/">
<head>
<meta name="author" content="Created with Masher by Half-Baked Software, registered to Gabriel."/>
<meta name="keywords" content="Masher, Hot Potatoes, Half-Baked Software, Windows, University of Victoria"/>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ejercicios de Aprendizaje</title>

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
	color: #333;
	display: flex;
	flex-direction: column;
	min-height: 100vh;
}

/* NAVBAR */
nav {
	background: #ffffff;
	backdrop-filter: blur(10px);
	border-bottom: 3px solid #195aaa;
	padding: 1rem 3rem;
	display: flex;
	align-items: center;
	justify-content: space-between;
	box-shadow: 0 4px 20px rgba(25, 90, 170, 0.15);
}

.logo-space {
	min-width: 200px;
	height: 60px;
	display: flex;
	align-items: center;
	justify-content: center;
}

.logo-space img {
	max-height: 60px;
	max-width: 200px;
	width: auto;
	height: auto;
	object-fit: contain;
}

nav h1 {
	color: #1c3a70;
	font-size: 1.5rem;
	margin-left: auto;
	text-align: right;
	font-weight: 600;
	letter-spacing: 0.5px;
}

/* MAIN CONTENT */
main {
	flex: 1;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	padding: 3rem 2rem;
}

.Titles {
	text-align: center;
	margin-bottom: 3rem;
}

.ExerciseTitle {
	font-size: 2.5rem;
	color: #1c3a70;
	font-weight: 700;
	margin-bottom: 0.5rem;
	text-shadow: 0 2px 4px rgba(28, 58, 112, 0.1);
}

.ExerciseSubtitle {
	font-size: 1.3rem;
	color: #195aaa;
	font-weight: 500;
	margin-bottom: 1rem;
}

.IndexDiv {
	background: rgba(255, 255, 255, 0.95);
	border-radius: 15px;
	padding: 3rem 4rem;
	box-shadow: 0 10px 40px rgba(25, 90, 170, 0.15);
	border: 2px solid rgba(25, 90, 170, 0.2);
	min-width: 400px;
}

.Index {
	list-style: none;
	display: flex;
	flex-direction: column;
	gap: 1.5rem;
}

.Index li {
	margin: 0;
}

.Index a {
	display: inline-block;
	padding: 1rem 2rem;
	background: linear-gradient(135deg, #195aaa 0%, #2574d4 100%);
	color: #ffffff;
	text-decoration: none;
	border-radius: 10px;
	font-size: 1.1rem;
	font-weight: 600;
	transition: all 0.3s ease;
	border: 2px solid transparent;
	box-shadow: 0 4px 15px rgba(25, 90, 170, 0.25);
	cursor: pointer;
	min-width: 280px;
	text-align: center;
}

.Index a:hover {
	background: linear-gradient(135deg, #2574d4 0%, #3186e0 100%);
	transform: translateY(-3px);
	box-shadow: 0 8px 25px rgba(25, 90, 170, 0.35);
	border-color: rgba(255, 255, 255, 0.3);
}

.Index a:active {
	transform: translateY(-1px);
	box-shadow: 0 4px 15px rgba(25, 90, 170, 0.25);
}

/* FOOTER */
footer {
	background: #ffffff;
	backdrop-filter: blur(10px);
	border-top: 3px solid #195aaa;
	padding: 2rem 3rem;
	text-align: center;
	color: #1c3a70;
	box-shadow: 0 -4px 20px rgba(25, 90, 170, 0.15);
	margin-top: auto;
}

footer p {
	font-size: 0.95rem;
	margin: 0.5rem 0;
	line-height: 1.6;
}

footer small {
	display: block;
	margin-top: 0.5rem;
	color: #195aaa;
	font-size: 0.85rem;
}

/* RESPONSIVE */
@media (max-width: 1024px) {
	nav {
		padding: 1rem 1.5rem;
	}

	nav h1 {
		font-size: 1.3rem;
	}

	.IndexDiv {
		padding: 2.5rem 2rem;
	}
}

@media (max-width: 768px) {
	nav {
		flex-wrap: wrap;
		gap: 0.5rem;
		padding: 0.8rem 1rem;
		justify-content: flex-start;
	}

	.logo-space {
		min-width: 120px;
		height: 45px;
	}

	.logo-space img {
		max-height: 45px;
		max-width: 120px;
	}

	nav h1 {
		font-size: 1rem;
		margin-left: 0;
		width: 100%;
		text-align: center;
		order: 3;
	}

	main {
		padding: 1.5rem 1rem;
	}

	.Titles {
		margin-bottom: 1.5rem;
	}

	.ExerciseTitle {
		font-size: 1.8rem;
	}

	.ExerciseSubtitle {
		font-size: 1rem;
	}

	.IndexDiv {
		padding: 1.5rem;
		min-width: auto;
		max-width: 100%;
	}

	.Index a {
		padding: 0.8rem 1.5rem;
		font-size: 1rem;
		min-width: auto;
	}

	footer {
		padding: 1.5rem 1rem;
	}

	footer p {
		font-size: 0.9rem;
	}
}

@media (max-width: 480px) {
	nav {
		padding: 0.6rem 0.8rem;
	}

	.logo-space {
		min-width: 100px;
		height: 40px;
	}

	.logo-space img {
		max-height: 40px;
		max-width: 100px;
	}

	nav h1 {
		font-size: 0.9rem;
	}

	.Titles {
		margin-bottom: 1rem;
	}

	.ExerciseTitle {
		font-size: 1.5rem;
	}

	.ExerciseSubtitle {
		font-size: 0.95rem;
	}

	.IndexDiv {
		padding: 1rem;
	}

	.Index a {
		padding: 0.7rem 1rem;
		font-size: 0.95rem;
	}

	footer {
		padding: 1rem 0.8rem;
	}

	footer p {
		font-size: 0.85rem;
	}

	footer small {
		font-size: 0.75rem;
	}
}
</style>
</head>
<body>
<!-- NAVBAR -->
<nav>
	<div class="logo-space">
		<a href="index.htm"><img src="static/logo.png" alt="Logo"></a>
	</div>
	<h1>Ingeniería de Software II</h1>
</nav>

<!-- MAIN CONTENT -->
<main>
	<div class="Titles">
		<h2 class="ExerciseTitle">Bienvenido</h2>
		<p class="ExerciseSubtitle">Ejercicios sobre el resumen de la IV Unidad</p>
	</div>

	<div style="text-align: center;">
		<div class="IndexDiv">
			<ul class="Index">
				<li><a href="Completar las oraciones.htm">Completar las oraciones</a></li>
			</ul>
		</div>
	</div>
</main>

<!-- FOOTER -->
<footer>
	<strong>Elaborado por: Gabriel Alexander Gonzalez</strong>
	<strong> | Grupo: 4T2-SIS</strong>
</footer>
</body>
</html>
